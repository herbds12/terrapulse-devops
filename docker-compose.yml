# =====================================================================
# TerraPulse - orquestracao local (API + SQL Server)
# Uso:  cp .env.example .env   &&   docker compose up -d --build
# =====================================================================
name: terrapulse

services:
  terrapulse-api:
    container_name: terrapulse-api
    image: terrapulse-api:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Docker}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=terrapulse-sqlserver,1433;Database=${DB_NAME:-TerraPulseDb};User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      Database__ApplyMigrations: "true"
      Swagger__Enabled: "true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-TerraPulse.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-TerraPulse.Client}
    depends_on:
      terrapulse-sqlserver:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - terrapulse-network

  terrapulse-sqlserver:
    container_name: terrapulse-sqlserver
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "${DB_PORT:-14333}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
      MSSQL_PID: "Developer"
    volumes:
      - terrapulse-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - terrapulse-network

networks:
  terrapulse-network:
    name: terrapulse-network
    driver: bridge

volumes:
  terrapulse-sqlserver-data:
    name: terrapulse-sqlserver-data
